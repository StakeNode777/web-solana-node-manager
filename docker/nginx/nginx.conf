server {
    # Listen on port 80
    listen 80;
    server_name localhost;
    # Set the root directory to your Yii2 web folder
    root /var/www/html/web;
    # Set the default index files
    index index.php index.html;

    charset utf-8;

    # Handle all requests by routing them through index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP scripts to the PHP-FPM container
    location ~ \.php$ {
        # The `app` is the name of our PHP service in docker-compose.yml
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Prevent direct access to hidden files
    location ~ /\. {
        deny all;
    }

    # Avoid processing files we don't need to
    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires max;
        log_not_found off;
    }
}
