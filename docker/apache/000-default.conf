<VirtualHost *:80>
    # Set the DocumentRoot to the public web folder of your Yii2 application
    DocumentRoot /var/www/html/web

    <Directory "/var/www/html/web">
        # Use .htaccess files for URL rewriting
        AllowOverride All
        # Require all to be granted access to the directory
        Require all granted
    </Directory>

    # The logging setup
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
